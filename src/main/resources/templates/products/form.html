<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>New Product</title></head>
<body>
<h2>Thêm sản phẩm</h2>
<form th:action="@{/products}" method="post" th:object="${product}">
    <label>Tên: <input type="text" th:field="*{name}"/></label><br/>
    <label>Giá: <input type="number" step="0.01" th:field="*{price}"/></label><br/>
    <label>In Stock: <input type="checkbox" th:field="*{inStock}"/></label><br/>
    <label>Category:
        <select th:field="*{category}">
            <option th:each="c: ${categories}" th:value="${c}" th:text="${c.name}"></option>
        </select>
    </label><br/>
    <button type="submit">Save</button>
</form>
</body>
</html>
