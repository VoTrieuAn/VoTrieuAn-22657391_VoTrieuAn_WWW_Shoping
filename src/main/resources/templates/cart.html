<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::body})}">
<body>
<section>
    <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold">Giỏ hàng</h1>
        <div class="text-gray-600">Số lượng: <span th:text="${totalQuantity}">0</span></div>
    </div>

    <div th:if="${success}" class="mb-3 text-green-700 bg-green-50 border border-green-200 rounded p-3" th:text="${success}"></div>
    <div th:if="${error}" class="mb-3 text-red-700 bg-red-50 border border-red-200 rounded p-3" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(items)}" class="bg-white rounded-xl shadow p-6">
        <p>Giỏ hàng trống.</p>
        <a class="inline-block mt-3 px-4 py-2 border border-blue-400 rounded" href="/products">Tiếp tục mua sắm</a>
    </div>

    <div th:unless="${#lists.isEmpty(items)}" class="space-y-4">
        <div class="overflow-x-auto bg-white rounded-xl shadow">
            <table class="min-w-full">
                <thead>
                <tr class="border-b">
                    <th class="text-left p-3">Sản phẩm</th>
                    <th class="text-right p-3">Đơn giá</th>
                    <th class="text-right p-3">Số lượng</th>
                    <th class="text-right p-3">Thành tiền</th>
                    <th class="text-left p-3">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${items}" class="border-b">
                    <td class="p-3">
                        <div class="flex items-center gap-3">
                            <img th:if="${item.imageUrl}" th:src="${item.imageUrl}" alt="img" class="w-12 h-12 object-cover rounded border"/>
                            <span th:text="${item.name}">Tên sản phẩm</span>
                        </div>
                    </td>
                    <td class="p-3 text-right" th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}">0</td>
                    <td class="p-3 text-right">
                        <form th:id="${'update-form-' + item.id}" th:action="@{/cart/update}" method="post" class="inline-flex items-center gap-2 justify-end" xmlns:sec="https://www.thymeleaf.org/extras/spring-security" sec:authorize="isAuthenticated()">
                            <input type="hidden" name="id" th:value="${item.id}"/>
                            <input type="number" name="quantity" min="0" class="w-20 border rounded px-2 py-1" th:value="${item.quantity}" onchange="this.form.submit()" />
                            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                        </form>
                    </td>
                    <td class="p-3 text-right" th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT')}">0</td>
                    <td class="p-3">
                        <form th:action="@{/cart/remove}" method="post" xmlns:sec="https://www.thymeleaf.org/extras/spring-security" sec:authorize="isAuthenticated()">
                            <input type="hidden" name="id" th:value="${item.id}"/>
                            <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                            <button class="px-3 py-1 rounded border border-red-600 text-red-600" type="submit">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="3" class="p-3 text-right">Tổng cộng</th>
                    <th class="p-3 text-right" th:text="${#numbers.formatDecimal(totalPrice, 0, 'COMMA', 0, 'POINT')}">0</th>
                    <th></th>
                </tr>
                </tfoot>
            </table>
        </div>

        <div class="flex flex-wrap gap-2">
            <form th:action="@{/cart/clear}" method="post" xmlns:sec="https://www.thymeleaf.org/extras/spring-security" sec:authorize="isAuthenticated()">
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}"/>
                <button class="px-4 py-2 border border-blue-400 rounded" type="submit">Xóa giỏ hàng</button>
            </form>
            <a class="px-4 py-2 border border-blue-400 rounded" href="/products">Tiếp tục mua sắm</a>

            <!-- Thanh toán: dẫn đến trang form fake -->
            <a th:href="@{/cart/checkout}" class="px-4 py-2 bg-blue-400 text-white rounded" xmlns:sec="https://www.thymeleaf.org/extras/spring-security" sec:authorize="isAuthenticated()">Thanh toán</a>

            <!-- Gợi ý đăng nhập khi chưa đăng nhập -->
            <a href="/login" class="px-4 py-2 border border-blue-400 rounded" xmlns:sec="https://www.thymeleaf.org/extras/spring-security" sec:authorize="isAnonymous()">Đăng nhập để thanh toán</a>
        </div>

        <div class="text-sm text-gray-500">Lưu ý: Giỏ hàng lưu trong session, không ghi vào cơ sở dữ liệu.</div>
    </div>
</section>
</body>
</html>
