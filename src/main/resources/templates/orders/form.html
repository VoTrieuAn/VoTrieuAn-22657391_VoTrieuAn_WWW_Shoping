<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::body})}">
<body>
<section class="max-w-xl mx-auto">
    <h2 class="text-2xl font-bold mb-4">Tạo đơn hàng</h2>
    <div th:if="${success}" class="mb-3 text-green-700 bg-green-50 border border-green-200 rounded p-3"
         th:text="${success}"></div>
    <div th:if="${error}" class="mb-3 text-red-700 bg-red-50 border border-red-200 rounded p-3"
         th:text="${error}"></div>

    <form th:action="@{/orders}" method="post" class="bg-white rounded-xl shadow p-4 space-y-4">
        <div sec:authorize="hasRole('ADMIN')">
            <label class="block mb-2">Khách hàng</label>
            <select name="customerId" class="w-full border rounded p-2">
                <option th:each="c: ${customers}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>
        <div sec:authorize="hasRole('CUSTOMER')">
            <input type="hidden" name="customerId" th:value="${currentCustomerId}"/>
            <p class="text-sm text-gray-600">Đặt hàng với tài khoản của bạn.</p>
        </div>

        <div>
            <label class="block mb-2">Sản phẩm</label>
            <select name="productId" class="w-full border rounded p-2">
                <option th:each="p: ${products}" th:selected="${preselectProductId} == ${p.id}"
                        th:value="${p.id}" th:text="${p.name}"></option>
            </select>
        </div>

        <div>
            <label class="block mb-2">Số lượng</label>
            <input type="number" min="1" name="amount" value="1" class="w-full border rounded p-2"/>
        </div>

        <div class="flex gap-2">
            <button type="submit" class="px-4 py-2 bg-black text-white rounded">Tạo</button>
            <a href="/products" class="px-4 py-2 border rounded">Hủy</a>
        </div>
    </form>
</section>
</body>
</html>
