<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
  th:fragment="layout(content)"
>
  <head>
    <meta charset="UTF-8" />
    <title th:text="${title} ?: 'Shop'">Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow sticky top-0 z-10">
      <div
        class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-4"
      >
        <div class="flex items-center gap-4">
          <a href="/products" class="text-xl font-bold text-blue-400"
            >AnVoShop</a
          >
          <nav class="hidden sm:flex items-center gap-3 text-sm">
            <a href="/products" class="hover:underline text-base">Sản phẩm</a>
            <a
              href="/orders/new"
              class="hover:underline text-base"
              sec:authorize="hasAnyRole('ADMIN')"
              >Tạo đơn hàng</a
            >
            <a
              href="/orders"
              class="hover:underline text-base"
              sec:authorize="hasAnyRole('CUSTOMER','ADMIN')"
              >Đơn hàng</a
            >
            <a
              href="/customers"
              class="hover:underline text-base"
              sec:authorize="hasRole('ADMIN')"
              >Khách hàng</a
            >
            <a
              href="/profile"
              class="hover:underline text-base"
              sec:authorize="isAuthenticated()"
              >Hồ sơ</a
            >
          </nav>
        </div>
        <div class="flex-1"></div>
        <form
          th:action="@{/products}"
          method="get"
          class="hidden md:flex gap-2"
        >
          <input
            name="q"
            th:value="${q}"
            placeholder="Tìm sản phẩm..."
            class="border rounded px-3 py-2"
          />
          <button class="px-4 py-2 bg-blue-400 text-white rounded">Tìm</button>
        </form>
        <div class="flex items-center gap-3">
          <span class="text-sm text-gray-600" sec:authorize="isAuthenticated()">
            Xin chào, <span sec:authentication="name">user</span>
          </span>
          <a
            href="/cart"
            class="relative px-3 py-2 border border-blue-400 rounded flex items-center gap-2"
            xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
            sec:authorize="isAuthenticated()"
          >
            <span>Giỏ hàng</span>
            <span
              class="inline-flex items-center justify-center min-w-6 h-6 rounded-full bg-blue-400 text-white text-xs px-2"
              th:text="${cartCount}"
              >0</span
            >
          </a>
          <a
            href="/login"
            class="px-3 py-2 border border-blue-400 rounded"
            sec:authorize="isAnonymous()"
            >Đăng nhập</a
          >
          <a
            href="/register"
            class="px-3 py-2 border border-blue-400 rounded"
            sec:authorize="isAnonymous()"
            >Đăng ký</a
          >
          <form
            th:action="@{/logout}"
            method="post"
            sec:authorize="isAuthenticated()"
          >
            <a
              th:href="@{/logout}"
              class="px-3 py-2 border border-blue-400 rounded"
            >
              Đăng xuất
            </a>
          </form>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6" th:insert="${content}"></main>

    <!-- Chat Widget -->
    <div id="chatWidget" class="fixed bottom-4 right-4 z-50">
      <!-- Chat Toggle Button -->
      <button
        id="chatToggle"
        class="w-14 h-14 bg-blue-500 hover:bg-blue-600 text-white rounded-full shadow-lg flex items-center justify-center transition-all"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
          />
        </svg>
      </button>

      <!-- Chat Box -->
      <div
        id="chatBox"
        class="hidden flex-col w-80 h-96 bg-white rounded-lg shadow-2xl overflow-hidden"
      >
        <!-- Chat Header -->
        <div
          class="bg-blue-500 text-white px-4 py-3 flex items-center justify-between"
        >
          <div class="flex items-center gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"
              />
            </svg>
            <span class="font-semibold">Trợ lý mua sắm</span>
          </div>
          <button id="chatClose" class="hover:bg-blue-600 rounded p-1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <!-- Chat Messages -->
        <div
          id="chatMessages"
          class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50"
        >
          <div class="flex items-start gap-2">
            <div
              class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-sm flex-shrink-0"
            >
              AI
            </div>
            <div class="bg-white rounded-lg px-3 py-2 shadow-sm max-w-xs">
              <p class="text-sm">
                Xin chào! Tôi có thể giúp bạn tìm sản phẩm. Hãy hỏi tôi bất cứ
                điều gì! 😊
              </p>
            </div>
          </div>
        </div>

        <!-- Chat Input -->
        <div class="border-t p-3 bg-white">
          <form id="chatForm" class="flex gap-2">
            <input
              id="chatInput"
              type="text"
              placeholder="Nhập tin nhắn..."
              class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              autocomplete="off"
            />
            <button
              type="submit"
              class="bg-blue-500 hover:bg-blue-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors"
            >
              Gửi
            </button>
          </form>
        </div>
      </div>
    </div>

    <script>
      // Chat Widget Functionality
      const chatToggle = document.getElementById("chatToggle");
      const chatBox = document.getElementById("chatBox");
      const chatClose = document.getElementById("chatClose");
      const chatForm = document.getElementById("chatForm");
      const chatInput = document.getElementById("chatInput");
      const chatMessages = document.getElementById("chatMessages");

      let historyLoaded = false; // Track if history has been loaded

      // Load chat history from session
      async function loadChatHistory() {
        if (historyLoaded) return; // Don't load multiple times

        try {
          const response = await fetch("/api/chat/history");
          const data = await response.json();

          if (data.history && data.history.length > 0) {
            // Clear welcome message first
            chatMessages.innerHTML = "";

            // Load all previous conversations
            data.history.forEach((conv) => {
              addMessage(conv.message, true);
              addMessage(conv.response, false);
            });

            console.log(`Loaded ${data.count} chat messages from session`);
          }

          historyLoaded = true;
        } catch (error) {
          console.error("Failed to load chat history:", error);
          historyLoaded = true; // Don't retry on error
        }
      }

      // Toggle chat box
      chatToggle.addEventListener("click", () => {
        chatBox.classList.toggle("hidden");
        chatBox.classList.toggle("flex");
        if (!chatBox.classList.contains("hidden")) {
          chatInput.focus();
          // Load history when opening chat for the first time
          loadChatHistory();
        }
      });

      // Close chat box
      chatClose.addEventListener("click", () => {
        chatBox.classList.add("hidden");
        chatBox.classList.remove("flex");
      });

      // Add message to chat
      function addMessage(text, isUser = false) {
        const messageDiv = document.createElement("div");
        messageDiv.className =
          "flex items-start gap-2 " + (isUser ? "flex-row-reverse" : "");

        const avatar = document.createElement("div");
        avatar.className =
          "w-8 h-8 rounded-full flex items-center justify-center text-white text-sm flex-shrink-0 " +
          (isUser ? "bg-green-500" : "bg-blue-500");
        avatar.textContent = isUser ? "You" : "AI";

        const bubble = document.createElement("div");
        bubble.className =
          "rounded-lg px-3 py-2 shadow-sm max-w-xs " +
          (isUser ? "bg-green-500 text-white" : "bg-white");

        const p = document.createElement("p");
        p.className = "text-sm whitespace-pre-line";
        p.textContent = text;

        bubble.appendChild(p);
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(bubble);
        chatMessages.appendChild(messageDiv);

        // Scroll to bottom
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Handle form submission
      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const message = chatInput.value.trim();
        if (!message) return;

        // Add user message
        addMessage(message, true);
        chatInput.value = "";

        // Show loading
        const loadingDiv = document.createElement("div");
        loadingDiv.id = "loading";
        loadingDiv.className = "flex items-start gap-2";
        loadingDiv.innerHTML = `
            <div class="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white text-sm flex-shrink-0">AI</div>
            <div class="bg-white rounded-lg px-3 py-2 shadow-sm">
                <p class="text-sm text-gray-500">Đang suy nghĩ...</p>
            </div>
        `;
        chatMessages.appendChild(loadingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
          // Call API
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message: message }),
          });

          const data = await response.json();

          // Remove loading
          loadingDiv.remove();

          // Add bot response
          addMessage(
            data.response || "Xin lỗi, tôi không thể trả lời lúc này.",
            false
          );
        } catch (error) {
          console.error("Chat error:", error);
          loadingDiv.remove();
          addMessage("Xin lỗi, đã xảy ra lỗi. Vui lòng thử lại sau.", false);
        }
      });
    </script>

    <footer class="text-center text-sm text-gray-500 py-8">
      © 2025 AnVoShop
    </footer>
  </body>
</html>
